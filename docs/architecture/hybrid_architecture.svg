ion + step matching</text><text x="490.0" y="175" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">1 video call, 1 text call</text><line x1="320" y1="164" x2="356" y2="164" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/><line x1="190" y1="192" x2="190" y2="228" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/><line x1="490" y1="192" x2="490" y2="228" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="232" width="600" height="186" rx="16" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><text x="60" y="252" dominant-baseline="central" class="th" fill="#2C2C2A">Separate check and verifier per error type</text><rect x="60" y="270" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="124.0" y="289" text-anchor="middle" dominant-baseline="central" class="th" fill="#085041">Termination</text><text x="124.0" y="309" text-anchor="middle" dominant-baseline="central" class="ts" fill="#0F6E56">Final clip</text><rect x="204" y="270" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="268.0" y="289" text-anchor="middle" dominant-baseline="central" class="th" fill="#085041">Misordering</text><text x="268.0" y="309" text-anchor="middle" dominant-baseline="central" class="ts" fill="#0F6E56">Order rule</text><rect x="348" y="270" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="412.0" y="289" text-anchor="middle" dominant-baseline="central" class="th" fill="#085041">Omission</text><text x="412.0" y="309" text-anchor="middle" dominant-baseline="central" class="ts" fill="#0F6E56">Narration judge</text><rect x="492" y="270" width="128" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="556.0" y="289" text-anchor="middle" dominant-baseline="central" class="th" fill="#633806">Addition</text><text x="556.0" y="309" text-anchor="middle" dominant-baseline="central" class="ts" fill="#854F0B">Off-graph</text><rect x="132" y="342" width="128" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="196.0" y="361" text-anchor="middle" dominant-baseline="central" class="th" fill="#633806">Repeat</text><text x="196.0" y="381" text-anchor="middle" dominant-baseline="central" class="ts" fill="#854F0B">Step counting</text><rect x="276" y="342" width="128" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8"/><text x="340.0" y="361" text-anchor="middle" dominant-baseline="central" class="th" fill="#791F1F">Wrong tool</text><text x="340.0" y="381" text-anchor="middle" dominant-baseline="central" class="ts" fill="#A32D2D">Moment + question</text><rect x="420" y="342" width="128" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8"/><text x="484.0" y="361" text-anchor="middle" dominant-baseline="central" class="th" fill="#791F1F">Parameter</text><text x="484.0" y="381" text-anchor="middle" dominant-baseline="central" class="ts" fill="#A32D2D">Explicit counts</text><line x1="340" y1="418" x2="340" y2="454" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="458" width="300" height="56" rx="8" fill="#F8F7F4" stroke="#B4B2A9" stroke-width="0.8"/><text x="340.0" y="477" text-anchor="middle" dominant-baseline="central" class="th" fill="#2C2C2A">Routing</text><text x="340.0" y="497" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">Confirmed flag, else human review</text><line x1="340" y1="514" x2="340" y2="550" stroke="#73726C" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="554" width="300" height="56" rx="8" fill="#F8F7F4" stroke="#B4B2A9" stroke-width="0.8"/><text x="340.0" y="573" text-anchor="middle" dominant-baseline="central" class="th" fill="#2C2C2A">Senior QC, client delivery</text><text x="340.0" y="593" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">Human decision is final</text>